<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virtual Studio v0.2</title><style>
*{box-sizing:border-box}body{margin:0;background:#101318;color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.app{height:100vh;display:grid;grid-template-rows:58px 1fr 135px}.top{display:flex;align-items:center;gap:8px;padding:8px;background:#171b22;overflow:auto}.top button,.cam button{background:#272d37;color:white;border:1px solid #414957;border-radius:9px;padding:9px}.brand{font-weight:800;white-space:nowrap}.main{display:grid;grid-template-columns:170px 1fr 220px;min-height:0}.panel{background:#171b22;padding:10px;overflow:auto}.left{border-right:1px solid #343b47}.right{border-left:1px solid #343b47}h3{font-size:11px;letter-spacing:.12em;color:#9da8b7}label{display:flex;justify-content:space-between;font-size:11px;margin-top:9px}input[type=range],select{width:100%}select{background:#272d37;color:white;padding:7px;border:1px solid #414957;border-radius:7px}.view{position:relative;overflow:hidden;background:linear-gradient(#29313d,#11151b)}.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:.3s}.person{position:relative;width:180px;height:455px;transform-origin:50% 55%}.head{position:absolute;z-index:4;top:35px;left:58px;width:64px;height:88px;background:#c98f72;border-radius:47%}.eye{position:absolute;top:39px;width:8px;height:5px;background:#7ec8ff;border-radius:50%}.el{left:16px}.er{right:16px}.body{position:absolute;z-index:2;top:137px;left:45px;width:90px;height:160px;background:#424b59;border-radius:42% 42% 22% 22%}.arm{position:absolute;top:145px;width:23px;height:170px;background:#c58a70;border-radius:14px;transform-origin:50% 10%}.al{left:32px}.ar{right:32px}.leg{position:absolute;top:285px;width:30px;height:165px;background:#b97f67;border-radius:15px}.ll{left:57px}.lr{right:57px}.hair{position:absolute;z-index:5;top:20px;width:61px;height:275px;background:linear-gradient(90deg,#050506,#1c1d21,#050506);transform-origin:50% 10%;border-radius:50% 45% 35% 45%}.hl{left:35px}.hr{right:35px}.cover{position:absolute;z-index:6;top:47px;left:54px;width:72px;height:80px;background:#0b0b0d;border-radius:45%;opacity:0}.badge,.status{position:absolute;background:#0a0d12cc;padding:8px;border-radius:8px;font-size:11px}.badge{top:10px;left:10px}.status{bottom:10px;left:10px}.cam{position:absolute;right:10px;top:10px;display:grid;grid-template-columns:1fr 1fr;gap:4px}.flash{position:absolute;inset:0;background:white;opacity:0;pointer-events:none}.flash.go{animation:f .35s}@keyframes f{35%{opacity:.95}100%{opacity:0}}.timeline{padding:9px 12px;background:#12161c;border-top:1px solid #343b47;font-size:11px}.bar{height:75px;margin-top:8px;position:relative;background:repeating-linear-gradient(90deg,#202630 0,#202630 49px,#353d49 50px);border-radius:7px}.tracks{padding:8px;line-height:19px;color:#aab4c2}.playhead{position:absolute;top:0;bottom:0;width:2px;background:white}.active{background:white!important;color:#111!important}@media(max-width:800px){.main{grid-template-columns:140px 1fr 185px}.panel{padding:7px}}
</style></head><body><div class="app"><div class="top"><span class="brand">VIRTUAL STUDIO v0.2</span><button id="live">LIVE</button><button id="freeze">FREEZE</button><button id="play">PLAY</button><button id="record">RECORD</button><button id="photo">PHOTO</button><span id="msg">Ready</span></div><div class="main">
<aside class="panel left"><h3>CHARACTER</h3><label>Scale <b id="scaleV">100</b></label><input id="scale" type="range" min="80" max="120" value="100"><label>Rotation <b id="rotV">0°</b></label><input id="rot" type="range" min="-35" max="35" value="0"><label>Left arm</label><input id="la" type="range" min="-80" max="80" value="0"><label>Right arm</label><input id="ra" type="range" min="-80" max="80" value="0"><h3>WARDROBE</h3><select id="cloth"><option value="#424b59">Neutral</option><option value="#eee">White</option><option value="#151517">Black</option><option value="#704f67">Dress Demo</option></select><h3>SCENE</h3><select id="scene"><option>Photo Studio</option><option>Cinema Studio</option><option>Dark Stage</option><option>Warm Interior</option></select></aside>
<main class="view" id="view"><div class="stage" id="stage"><div class="person" id="person"><div class="hair hl" id="hl"></div><div class="hair hr" id="hr"></div><div class="head"><i class="eye el"></i><i class="eye er"></i></div><div class="cover" id="cover"></div><div class="body" id="body"></div><div class="arm al" id="al"></div><div class="arm ar" id="ar"></div><div class="leg ll"></div><div class="leg lr"></div></div></div><div class="badge" id="mode">READY · Preview 2D</div><div class="cam"><button data-c="1">CAM 01</button><button data-c="2">CAM 02</button><button data-c="3">CAM 03</button><button data-c="4">CAM 04</button></div><div class="status" id="status">Controls ready</div><div class="flash" id="flash"></div></main>
<aside class="panel right"><h3>HAIR PHYSICS LAB</h3><label>Length <b id="lenV">100 cm</b></label><input id="len" type="range" min="60" max="140" value="100"><label>Wind <b id="windV">20</b></label><input id="wind" type="range" min="-100" max="100" value="20"><label>Inertia <b id="inertiaV">70</b></label><input id="inertia" type="range" min="0" max="100" value="70"><label>Damping <b id="dampingV">35</b></label><input id="damping" type="range" min="0" max="100" value="35"><label>Face cover <b id="faceV">0%</b></label><input id="face" type="range" min="0" max="100" value="0"><h3>CAMERA</h3><label>Zoom <b id="zoomV">100%</b></label><input id="zoom" type="range" min="65" max="160" value="100"></aside></div>
<div class="timeline"><b>TIMELINE</b> · BODY · HANDS · HAIR · PHYSICS · LIGHTS · CAMERA <span id="time">00:00.0</span><div class="bar"><div class="tracks">BODY<br>HAIR / PHYSICS<br>CAMERA</div><div class="playhead" id="ph"></div></div></div></div>
<script>(function(){function $(x){return document.getElementById(x)}function v(x){return +$(x).value}var live=0,frozen=0,playing=0,recording=0,t=0,last=0;function msg(s){$("msg").textContent=s;$("status").textContent=s}function render(){var s=v("scale")/100,z=v("zoom")/100,r=v("rot");$("person").style.transform="scale("+(s*z)+") rotate("+r+"deg)";$("scaleV").textContent=v("scale");$("rotV").textContent=r+"°";$("al").style.transform="rotate("+v("la")+"deg)";$("ar").style.transform="rotate("+(-v("ra"))+"deg)";var h=160+v("len")*1.15;$("hl").style.height=h+"px";$("hr").style.height=h+"px";$("lenV").textContent=v("len")+" cm";$("windV").textContent=v("wind");$("inertiaV").textContent=v("inertia");$("dampingV").textContent=v("damping");$("cover").style.opacity=v("face")/100;$("faceV").textContent=v("face")+"%";$("zoomV").textContent=v("zoom")+"%";$("body").style.background=$("cloth").value;var b=["linear-gradient(#29313d,#11151b)","linear-gradient(#222630,#080a0d)","linear-gradient(#0b0c0f,#020203)","linear-gradient(#4a3c36,#181311)"][$("scene").selectedIndex];$("view").style.background=b}["scale","rot","la","ra","len","wind","inertia","damping","face","zoom","cloth","scene"].forEach(function(x){$(x).oninput=function(){render();msg(x.toUpperCase()+" updated")};$(x).onchange=render});$("live").onclick=function(){live=!live;frozen=0;this.classList.toggle("active",live);$("freeze").classList.remove("active");$("mode").textContent=live?"LIVE · Preview 2D":"READY · Preview 2D";msg(live?"Live simulation running":"Live stopped")};$("freeze").onclick=function(){frozen=!frozen;if(frozen)live=0;this.classList.toggle("active",frozen);$("live").classList.remove("active");$("mode").textContent=frozen?"FROZEN · Preview 2D":"READY · Preview 2D";msg(frozen?"State frozen":"Freeze released")};$("play").onclick=function(){playing=!playing;this.classList.toggle("active",playing);msg(playing?"Timeline playing":"Timeline paused")};$("record").onclick=function(){recording=!recording;this.classList.toggle("active",recording);msg(recording?"Recording take":"Recording stopped")};$("photo").onclick=function(){$("flash").classList.remove("go");void $("flash").offsetWidth;$("flash").classList.add("go");msg("PHOTO captured · preview")};[].forEach.call(document.querySelectorAll("[data-c]"),function(b){b.onclick=function(){var c=this.getAttribute("data-c"),q={1:"scale(1)",2:"scale(1.3) translateY(5%)",3:"scale(1.7) translateY(16%)",4:"scale(.78)"};$("stage").style.transform=q[c];msg("Camera "+c+" selected")}});function loop(ts){if(!last)last=ts;var dt=(ts-last)/1000;last=ts;if(playing||live||recording)t=(t+dt)%10;$("ph").style.left=(t*10)+"%";$("time").textContent="00:"+("0"+Math.floor(t)).slice(-2)+"."+Math.floor(t%1*10);if(live&&!frozen){var w=v("wind")/100,i=v("inertia")/100,d=v("damping")/100,a=Math.sin(ts/350*(1.25-i*.6))*w*(13-d*5);$("hl").style.transform="rotate("+(a-1.5)+"deg)";$("hr").style.transform="rotate("+(a+1.5)+"deg)"}requestAnimationFrame(loop)}render();requestAnimationFrame(loop)})();</script></body></html>
